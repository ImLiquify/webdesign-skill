<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
<style>.box{fill:#f4f2ec;stroke:#cfcbc0}.t1{fill:#26241f}.t2{fill:#7b776d}.ln{stroke:#8a867c}.opt{fill:#faf9f5;stroke:#cfcbc0;stroke-dasharray:4 3}
@media (prefers-color-scheme: dark){.box{fill:#2b2a26;stroke:#55534c}.opt{fill:#24231f;stroke:#55534c}.t1{fill:#efede7}.t2{fill:#a29e94}}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a867c"/></marker></defs>
<rect x="10" y="20" width="150" height="70" rx="10" fill="#d97757"/>
<text x="85" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">/webdesign</text>
<text x="85" y="70" text-anchor="middle" font-size="12" fill="#fff">route: site or app</text>
<g font-size="14">
<rect class="box" x="200" y="20" width="150" height="70" rx="10"/><text class="t1" x="275" y="50" text-anchor="middle" font-weight="700">1 · Copy</text><text class="t2" x="275" y="70" text-anchor="middle" font-size="12">copywriting</text>
<rect class="box" x="380" y="20" width="150" height="70" rx="10"/><text class="t1" x="455" y="50" text-anchor="middle" font-weight="700">2 · References</text><text class="t2" x="455" y="70" text-anchor="middle" font-size="12">3 real sites, browser</text>
<rect class="box" x="560" y="20" width="160" height="70" rx="10"/><text class="t1" x="640" y="50" text-anchor="middle" font-weight="700">3 · Direction + build</text><text class="t2" x="640" y="70" text-anchor="middle" font-size="12">design-taste / impeccable</text>
<rect class="opt" x="750" y="20" width="140" height="70" rx="10"/><text class="t1" x="820" y="50" text-anchor="middle" font-weight="700">4 · Motion</text><text class="t2" x="820" y="70" text-anchor="middle" font-size="12">apple-design, if needed</text>
<rect class="box" x="750" y="170" width="140" height="70" rx="10"/><text class="t1" x="820" y="200" text-anchor="middle" font-weight="700">5 · Browser check</text><text class="t2" x="820" y="220" text-anchor="middle" font-size="12">375px + 1440px</text>
<rect class="box" x="540" y="170" width="180" height="70" rx="10"/><text class="t1" x="630" y="200" text-anchor="middle" font-weight="700">6 · Review + fix</text><text class="t2" x="630" y="220" text-anchor="middle" font-size="12">guidelines · audit · polish</text>
<rect class="opt" x="350" y="170" width="160" height="70" rx="10"/><text class="t1" x="430" y="200" text-anchor="middle" font-weight="700">7 · Performance</text><text class="t2" x="430" y="220" text-anchor="middle" font-size="12">webperf, for production</text>
<rect class="box" x="10" y="170" width="300" height="70" rx="10"/><text class="t1" x="160" y="200" text-anchor="middle" font-weight="700">Report + Lessons</text><text class="t2" x="160" y="220" text-anchor="middle" font-size="12">what ran, what changed, what to avoid next time</text>
</g>
<g class="ln" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M160 55H196"/><path d="M350 55H376"/><path d="M530 55H556"/><path d="M720 55H746"/><path d="M820 90V166"/><path d="M750 205H724"/><path d="M540 205H514"/><path d="M350 205H314"/>
</g>
<text class="t2" x="450" y="280" text-anchor="middle" font-size="13">Dashed stages run only when the request needs them. review mode starts at step 6 · quick mode skips optional stages</text>
</svg>
