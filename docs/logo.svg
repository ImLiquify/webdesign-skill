<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150">
<style>.t1{fill:#26241f}.t2{fill:#7b776d}.win{fill:#f4f2ec;stroke:#8a867c}.bar{fill:#e4e1d8}.blk{fill:#cfcbc0}@media (prefers-color-scheme: dark){.t1{fill:#efede7}.t2{fill:#a29e94}.win{fill:#2b2a26;stroke:#8a867c}.bar{fill:#3a3934}.blk{fill:#55534c}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cur{animation:move 3s ease-in-out infinite}@keyframes move{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,-14px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
