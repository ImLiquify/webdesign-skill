<rect class="blk" x="82" y="28" width="26" height="44"/>
<path class="cur" d="M96 66 l0 20 l5 -5 l4 9 l4 -2 l-4 -9 l7 0 z" fill="#1f1e1b" stroke="#fff" stroke-width="1.5"/>
